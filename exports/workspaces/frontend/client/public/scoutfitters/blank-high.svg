<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#14181f"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Simple workwear tee silhouette with pocket (generic, not brand art) -->
  <g filter="url(#shadow)">
    <path
      d="M190 165
         L290 100
         C330 74 375 60 450 60
         C525 60 570 74 610 100
         L710 165
         L825 290
         L745 365
         L700 335
         L700 1020
         C700 1065 665 1100 620 1100
         L280 1100
         C235 1100 200 1065 200 1020
         L200 335
         L155 365
         L75 290
         Z"
      fill="url(#bg)"
      stroke="rgba(255,255,255,0.10)"
      stroke-width="8"
      stroke-linejoin="round"
    />

    <!-- Collar -->
    <path
      d="M350 82
         C375 120 410 150 450 150
         C490 150 525 120 550 82"
      fill="none"
      stroke="rgba(255,255,255,0.14)"
      stroke-width="10"
      stroke-linecap="round"
    />

    <!-- Pocket (generic) -->
    <path
      d="M565 350
         L680 350
         L680 485
         C680 520 655 545 620 545
         C590 545 565 520 565 490
         Z"
      fill="rgba(255,255,255,0.03)"
      stroke="rgba(255,255,255,0.12)"
      stroke-width="6"
      stroke-linejoin="round"
    />
    <path
      d="M565 350
         L680 350"
      stroke="rgba(255,255,255,0.18)"
      stroke-width="6"
      stroke-linecap="round"
    />
  </g>

  <!-- Print zones (subtle guides; safe to keep in preview only) -->
  <g opacity="0.35">
    <!-- Front center (12\" x 12\" guide) -->
    <rect x="270" y="380" width="360" height="360" rx="18" fill="none" stroke="rgba(249,115,22,0.55)" stroke-width="6" stroke-dasharray="16 14"/>
    <!-- Left chest (4\" x 4\" guide) -->
    <rect x="510" y="370" width="160" height="160" rx="16" fill="none" stroke="rgba(249,115,22,0.40)" stroke-width="6" stroke-dasharray="14 12"/>
  </g>
</svg>

