name: Exchange stone retail verification
on:
  push:
    branches: [exchange/tradescout-stone-retail-20260921]
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'scripts/exchange-stone*'
      - '.github/workflows/exchange-stone-retail.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact source for implementation and verification
        run: |
          git rev-parse HEAD > exchange-source-revision.txt
          git archive --format=tar.gz --output=exchange-source.tar.gz HEAD
      - name: Run retail catalog checks when present
        run: |
          if [ -f scripts/exchange-stone-retail.test.mjs ]; then
            node --test scripts/exchange-stone-retail.test.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exchange-source-${{ github.sha }}
          path: |
            exchange-source.tar.gz
            exchange-source-revision.txt
          retention-days: 3
