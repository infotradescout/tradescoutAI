name: E2E

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # Use the Neon test database for all DB-backed tests.
      # CI will inject this from the repo secret.
      TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push schema to Neon test database
        run: npm run db:push:test

      - name: Build app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests (chromium)
        run: npm run e2e -- --project=chromium
