name: E2E

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # Use the Neon test database for all DB-backed tests.
      # CI will inject this from the repo secret.
      TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      # Auth credentials for E2E global setup. These are used to
      # bootstrap a master admin account and then log in via /api/auth/login.
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || secrets.MASTER_ADMIN_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.MASTER_ADMIN_PASSWORD }}
      MASTER_ADMIN_EMAIL: ${{ secrets.MASTER_ADMIN_EMAIL }}
      MASTER_ADMIN_PASSWORD: ${{ secrets.MASTER_ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push schema to Neon test database
        run: npm run db:push:test

      - name: Seed E2E user in Neon test database
        run: npm run seed:e2e-user

      - name: Build app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests (chromium, targeted)
        run: npx playwright test tests/direct-connect.e2e.spec.ts tests/scout-routing.e2e.spec.ts --project=chromium

      - name: Run CTA Playwright smoke test (chromium, required)
        run: npx playwright test tests/cta-smoke.spec.ts --project=chromium
