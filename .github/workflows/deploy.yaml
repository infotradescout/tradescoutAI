name: Production Release & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-render:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-render-production
      cancel-in-progress: true
    steps:
      - name: Verify deploy hook is configured
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Missing secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
      - name: Trigger Render
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy hook triggered."
