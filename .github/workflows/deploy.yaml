# Optional backup only. Production deploys via Render Auto-Deploy on push to main.
# See RELEASE_CONTROL.md. Do not treat this workflow as required for prod.
name: Production Release & Deploy

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full git SHA to document as the intended deploy target (informational; hook deploys branch HEAD).
        required: true
        type: string
      confirm_production:
        description: Type exactly DEPLOY_PRODUCTION to proceed.
        required: true
        type: string

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-render-production
      cancel-in-progress: false
    steps:
      - name: Reject accidental confirmations
        env:
          CONFIRM: ${{ inputs.confirm_production }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DEPLOY_PRODUCTION" ]; then
            echo "::error::Refusing deploy. confirm_production must be exactly DEPLOY_PRODUCTION."
            exit 1
          fi
          if ! [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::approved_sha must be a full 40-char commit SHA."
            exit 1
          fi

      - name: Checkout approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}

      - name: Verify checked-out commit matches approved SHA
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$APPROVED_SHA" ]; then
            echo "::error::Checkout mismatch. HEAD=$HEAD_SHA approved=$APPROVED_SHA"
            exit 1
          fi
          echo "Backup deploy target SHA: $HEAD_SHA"

      - name: Verify deploy hook is configured
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK}" ]; then
            echo "::error::Missing secret RENDER_DEPLOY_HOOK_URL. Prefer Render Auto-Deploy on main, or Dashboard Manual Deploy."
            exit 1
          fi

      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          echo "Triggering Render deploy hook (optional backup) for SHA ${APPROVED_SHA}"
          HTTP_CODE="$(curl -sS -o /tmp/render-hook-body.txt -w "%{http_code}" -X POST "${HOOK}")"
          BODY="$(cat /tmp/render-hook-body.txt || true)"
          echo "Render hook HTTP ${HTTP_CODE}"
          echo "$BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render deploy hook failed (HTTP ${HTTP_CODE}). Deploy NOT confirmed."
            exit 1
          fi
          echo "Render deploy hook accepted. Verify live build marker separately."
