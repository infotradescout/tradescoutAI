name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Forbidden-pattern guard
        run: npm run guard:forbidden

      - name: Build
        run: npm run build

      - name: Tests (with test DB schema push)
        run: npm run test:run:db
