name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      TEST_DB_LANE_LOCK_NAME: tradescout_test_db_integration_lane_v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Forbidden-pattern guard
        run: npm run guard:forbidden

      - name: Law drift guard
        run: npm run guard:law-drift

      - name: Architecture hygiene guard
        run: npm run guard:architecture-hygiene

      - name: HTTP semantics guard (4xx vs 5xx)
        run: npm run audit:http-semantics

      - name: Authority gate guard (intent-gated contact only)
        run: npm run audit:authority-gates

      - name: Observability baseline guard
        run: npm run audit:observability-baselines

      - name: Direct Connect gate regressions
        run: npm run test:direct-connect:gates

      - name: Build
        run: npm run build

      - name: Sitemap integrity guard
        run: npm run guard:sitemap-integrity

      - name: Tests (source/contracts without DB)
        run: npx cross-env TEST_DATABASE_URL= DATABASE_URL= RUN_INTEGRATION_TESTS= npm run test:run
