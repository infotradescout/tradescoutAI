name: Release Gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradescout_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tradescout_release_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: production
      REQUIRE_PROD_BYPASS_OFF: "true"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tradescout_release_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tradescout_release_test
      DIRECT_CONNECT_BETA_ADMIN_NOTIFICATIONS: "false"
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || secrets.MASTER_ADMIN_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.MASTER_ADMIN_PASSWORD }}
      MASTER_ADMIN_EMAIL: ${{ secrets.MASTER_ADMIN_EMAIL }}
      MASTER_ADMIN_PASSWORD: ${{ secrets.MASTER_ADMIN_PASSWORD }}
      TEST_DB_LANE_LOCK_NAME: tradescout_release_db_lane_v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: HTTP semantics guard (4xx vs 5xx)
        run: npm run audit:http-semantics

      - name: Authority gate guard (intent-gated contact only)
        run: npm run audit:authority-gates

      - name: Law drift guard
        run: npm run guard:law-drift

      - name: Production bypass guard
        run: npm run guard:prod-bypass

      - name: Observability baseline guard
        run: npm run audit:observability-baselines

      - name: Direct Connect gate regressions
        run: npm run test:direct-connect:gates

      - name: Trust leak guard (no stub copy in live UI)
        run: npm run audit:trust-leaks

      - name: Production debt guard
        run: npm run audit:production-debt

      - name: Secrets history guard
        run: npm run audit:secrets-history

      - name: Validate required test env
        run: |
          test -n "$TEST_DATABASE_URL"
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
          test -n "$MASTER_ADMIN_EMAIL"
          test -n "$MASTER_ADMIN_PASSWORD"

      - name: Push schema to isolated test DB
        run: node scripts/bootstrap-test-db.mjs --full-sync

      - name: JR Express endpoint integration
        run: node scripts/with-test-db-lane-lock.mjs -- npm run test:tradepartner-express:jrs:db

      - name: Direct Connect gate integration
        run: node scripts/with-test-db-lane-lock.mjs -- npm run test:direct-connect:gates:db

      - name: Run integration tests (default)
        run: node scripts/with-test-db-lane-lock.mjs -- npm run test:integration

      - name: Run integration tests (strict)
        run: node scripts/with-test-db-lane-lock.mjs -- npm run test:integration:strict

      - name: Seed E2E user
        run: npm run seed:e2e-user

      - name: Build app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run release gate tests
        run: node scripts/with-test-db-lane-lock.mjs -- npm run test:release-gates

      - name: Compute release gate metrics
        run: npm run report:release-gates

      - name: Upload release gate metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-metrics
          path: artifacts/release-gate-metrics.json
          retention-days: 14
