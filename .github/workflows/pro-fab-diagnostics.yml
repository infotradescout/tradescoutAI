name: Pro Fab Diagnostics

on:
  pull_request:

concurrency:
  group: pro-fab-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-segments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: TypeScript check
        continue-on-error: true
        run: npm run check

      - name: Verify test inventory
        continue-on-error: true
        run: node scripts/verify-tests.mjs

      - name: Theme audit
        continue-on-error: true
        run: npm run audit:theme

      - name: Blur audit
        continue-on-error: true
        run: npm run audit:blur

      - name: HTTP semantics audit
        continue-on-error: true
        run: npm run audit:http-semantics

      - name: Authority gates audit
        continue-on-error: true
        run: npm run audit:authority-gates

      - name: Trust leaks audit
        continue-on-error: true
        run: npm run audit:trust-leaks

      - name: User-facing errors audit
        continue-on-error: true
        run: npm run audit:user-facing-errors

      - name: Observability audit
        continue-on-error: true
        run: npm run audit:observability-baselines

      - name: Production debt audit
        continue-on-error: true
        run: npm run audit:production-debt

      - name: Secrets history audit
        continue-on-error: true
        run: npm run audit:secrets-history

      - name: Affiliate integrity audit
        continue-on-error: true
        run: npm run audit:affiliate-integrity:strict

      - name: Documentation links audit
        continue-on-error: true
        run: npm run audit:doc-links:entry

      - name: Legacy guard
        continue-on-error: true
        run: npm run verify:legacy-guard

      - name: Scout purity
        continue-on-error: true
        run: npm run verify:scout-purity

      - name: Shell architecture
        continue-on-error: true
        run: npm run verify:shells

      - name: City branding
        continue-on-error: true
        run: npm run verify:city-branding

      - name: Brand scope
        continue-on-error: true
        run: npm run guard:brand-scope

      - name: Admin route aliases
        continue-on-error: true
        run: npm run guard:admin-route-aliases

      - name: Law drift
        continue-on-error: true
        run: npm run guard:law-drift

      - name: Scout response contract
        continue-on-error: true
        run: npm run guard:scout-response-contract

      - name: Scout behavior registry
        continue-on-error: true
        run: npm run enforce:scout-behaviors

      - name: Dist Vite guard
        continue-on-error: true
        run: npm run verify:no-vite
