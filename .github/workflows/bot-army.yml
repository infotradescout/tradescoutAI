name: Bot Army - Regression Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 3am UTC
    - cron: '0 3 * * *'

jobs:
  test:
    name: Bot Army Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start test server
        run: |
          npm run build &
          npm run start &
          # Wait for server to be ready (max 30 seconds)
          for i in {1..30}; do
            if curl -f http://localhost:5000 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
        env:
          NODE_ENV: test

      - name: Run Bot Army tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5000
          AGENT_IDENTITY_EMAIL: ${{ secrets.AGENT_IDENTITY_EMAIL }}
          AGENT_IDENTITY_SECRET: ${{ secrets.AGENT_IDENTITY_SECRET }}
          AGENT_TYPE: bot_operator
          AGENT_CLAIMS: post,observe,seed
          AGENT_SCOPE_SLUG: ${{ secrets.AGENT_SCOPE_SLUG }}
          DEBUG: false
          CI: true
        continue-on-error: true

      - name: Generate Bot Army report
        if: always()
        run: npx ts-node tests/report/generate_report.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Bot Army report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bot-army-report
          path: tests/report/bot-army-report.html
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Test Results
          path: '.playwright/test-results/**/*.json'
          reporter: 'java-junit'
          fail-on-error: false

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.readFileSync('tests/report/bot-army-report.html', 'utf-8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Bot Army Regression Tests**\n\nSee attached artifacts for full report and Playwright details.'
            });

      - name: Fail if tests failed
        if: failure()
        run: |
          echo "❌ Bot Army tests failed. Check artifacts for details."
          exit 1
