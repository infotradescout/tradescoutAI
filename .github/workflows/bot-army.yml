name: Bot Army - Regression Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 3am UTC
    - cron: '0 3 * * *'

jobs:
  test:
    name: Bot Army Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || secrets.MASTER_ADMIN_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.MASTER_ADMIN_PASSWORD }}
      MASTER_ADMIN_EMAIL: ${{ secrets.MASTER_ADMIN_EMAIL }}
      MASTER_ADMIN_PASSWORD: ${{ secrets.MASTER_ADMIN_PASSWORD }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authority gate guard
        run: npm run audit:authority-gates

      - name: Trust leak guard
        run: npm run audit:trust-leaks

      - name: Observability baseline guard
        run: npm run audit:observability-baselines

      - name: Production debt guard
        run: npm run audit:production-debt

      - name: Secrets history guard
        run: npm run audit:secrets-history

      - name: Validate required test env
        run: |
          test -n "$TEST_DATABASE_URL"
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
          test -n "$MASTER_ADMIN_EMAIL"
          test -n "$MASTER_ADMIN_PASSWORD"

      - name: Push schema to test DB
        run: npm run db:push:test

      - name: Seed E2E user
        run: npm run seed:e2e-user

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start test server
        run: |
          npm run build
          npm run start &
          # Wait for server to be ready (max 30 seconds)
          for i in {1..30}; do
            if curl -f http://localhost:5000 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
        env:
          NODE_ENV: test

      - name: Write Bot Army env
        shell: bash
        env:
          AGENT_IDENTITY_EMAIL: ${{ secrets.AGENT_IDENTITY_EMAIL }}
          AGENT_IDENTITY_SECRET: ${{ secrets.AGENT_IDENTITY_SECRET }}
          AGENT_SCOPE_SLUG: ${{ secrets.AGENT_SCOPE_SLUG }}
        run: |
          set -euo pipefail
          agent_email="${AGENT_IDENTITY_EMAIL:-${E2E_EMAIL:-$MASTER_ADMIN_EMAIL}}"
          agent_secret="${AGENT_IDENTITY_SECRET:-${E2E_PASSWORD:-$MASTER_ADMIN_PASSWORD}}"
          agent_slug="${AGENT_SCOPE_SLUG:-}"
          if [ -z "$agent_slug" ]; then
            agent_slug="$(AGENT_EMAIL="$agent_email" node --input-type=module -e 'import { createHash } from "crypto"; const email = String(process.env.AGENT_EMAIL || "test.agent@tradescout.local"); const local = email.split("@")[0].replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "").toLowerCase().slice(0, 24); const digest = createHash("sha1").update(email.toLowerCase()).digest("hex").slice(0, 8); console.log(`${local || "e2e-user"}-${digest}`);')"
          fi
          cat > tests/.env <<EOF
          BASE_URL=http://localhost:5000
          AGENT_IDENTITY_EMAIL=$agent_email
          AGENT_IDENTITY_SECRET=$agent_secret
          AGENT_TYPE=bot_operator
          AGENT_CLAIMS=post,observe,seed
          AGENT_SCOPE_SLUG=$agent_slug
          DEBUG=false
          TEST_SEED=12345
          EOF

      - name: Run Bot Army tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5000
          AGENT_IDENTITY_EMAIL: ${{ secrets.AGENT_IDENTITY_EMAIL || secrets.E2E_EMAIL || secrets.MASTER_ADMIN_EMAIL }}
          AGENT_IDENTITY_SECRET: ${{ secrets.AGENT_IDENTITY_SECRET || secrets.E2E_PASSWORD || secrets.MASTER_ADMIN_PASSWORD }}
          AGENT_TYPE: bot_operator
          AGENT_CLAIMS: post,observe,seed
          DEBUG: false
          CI: true

      - name: Generate Bot Army report
        if: always()
        run: npm run test:e2e:report:bot-army

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Bot Army report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-army-report
          path: tests/report/bot-army-report.html
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Test Results
          path: '.playwright/test-results/**/*.json'
          reporter: 'java-junit'
          fail-on-error: false

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.readFileSync('tests/report/bot-army-report.html', 'utf-8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Bot Army Regression Tests\n\nSee attached artifacts for full report and Playwright details.'
            });

      - name: Fail if tests failed
        if: failure()
        run: |
          echo "Bot Army tests failed. Check artifacts for details."
          exit 1
