    <style>
      #ts-boot-fallback[hidden] {
        display: none !important;
      }

      #ts-boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: radial-gradient(circle at top, #12233f 0%, #050b15 55%, #02050c 100%);
        color: #e2e8f0;
        font-family:
          "Work Sans",
          "Inter",
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        z-index: 9999;
      }

      .ts-boot-card {
        width: min(560px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.92);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
        padding: 18px;
      }

      .ts-boot-title {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 700;
        color: #f8fafc;
      }

      .ts-boot-subtitle {
        margin: 0 0 10px;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.45;
      }

      .ts-boot-detail {
        margin: 0;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.4;
      }

      .ts-boot-actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
      }

      .ts-boot-reload {
        border: 1px solid #f97316;
        border-radius: 999px;
        padding: 8px 14px;
        background: rgba(249, 115, 22, 0.18);
        color: #fed7aa;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="ts-boot-fallback" hidden aria-hidden="true" role="alert" aria-live="assertive">
      <section class="ts-boot-card">
        <h1 class="ts-boot-title">TradeScout encountered a startup issue.</h1>
        <p id="ts-boot-fallback-message" class="ts-boot-subtitle">
          We could not render the app yet.
        </p>
        <p id="ts-boot-fallback-detail" class="ts-boot-detail">
          Reload to recover. If this keeps happening, report it.
        </p>
        <div class="ts-boot-actions">
          <button class="ts-boot-reload" type="button" onclick="window.location.reload()">
            Reload TradeScout
          </button>
        </div>
      </section>
    </div>
    <noscript>
      <div id="ts-boot-fallback-noscript" aria-hidden="false" role="alert" aria-live="assertive">
        <section class="ts-boot-card">
          <h1 class="ts-boot-title">JavaScript is required.</h1>
          <p class="ts-boot-subtitle">Enable JavaScript to continue to TradeScout.</p>
        </section>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
