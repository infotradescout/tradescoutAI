
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeScout - Connect with Local Contractors</title>
    <meta name="description" content="Find trusted contractors, get quotes, and manage home improvement projects with TradeScout." />
    <script>
      // Override CSP errors by catching and ignoring them
      window.addEventListener('securitypolicyviolation', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      });
      
      // Force override any CSP restrictions
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, attempting CSP override');
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="padding: 20px; background: #f0f0f0; border: 2px solid #333; margin: 20px;">
        <h1>TradeScout Loading...</h1>
        <p id="js-test">JavaScript NOT loaded</p>
        <script>
          document.getElementById('js-test').innerHTML = 'JavaScript IS working!';
          document.getElementById('js-test').style.color = 'green';
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
