services:
  - type: web
    name: tradescoutAI
    # Production is the existing Git-backed Docker Starter service. The image
    # includes the migration tooling required by this pre-deploy command.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    # main is the release channel: Render auto-deploys on commit.
    # Do NOT use checksPass (deadlock risk with post-deploy observers).
    # GitHub Actions deploy workflow is optional backup only — not required for prod.
    autoDeployTrigger: commit
    preDeployCommand: npm run db:migrate && npm run db:verify:required
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: RUNTIME_MIGRATIONS_MODE
        value: "off"
      - key: HUSKY
        value: "0"
      - key: PORT
        value: "10000"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_LEADER_ONLY
        value: "true"
      - key: SCHEDULER_LEADER_LOCK_ID
        value: "72418031"
      - key: TRADESCOUT_EXTERNAL_FETCH_TIMEOUT_MS
        value: "8000"
      - key: TRADESCOUT_EXTERNAL_FETCH_RETRIES
        value: "2"
      - key: TRADESCOUT_EXTERNAL_FETCH_BACKOFF_MS
        value: "250"
      - key: SCOUT_RECOMMENDATIONS_ENABLED
        value: "true"
      - key: DIRECT_CONNECT_CREATE_LIMIT_15M
        value: "12"
      - key: DIRECT_CONNECT_WORKFLOW_LIMIT_1M
        value: "90"
      - key: DIRECT_CONNECT_PROVIDER_RESPONSE_LIMIT_10M
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: MASTER_ADMIN_FIRST_NAME
        sync: false
      - key: MASTER_ADMIN_LAST_NAME
        sync: false
      - key: DISABLE_FACEBOOK_AUTH
        value: "true"
      - key: EMAIL_MODE
        value: account_creation_only
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: TRADESCOUT_GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_MAP_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: PUBLIC_URL_BASE
        sync: false
      - key: MEALSCOUT_BASE_URL
        sync: false
      - key: MEALSCOUT_SHARED_SECRET
        sync: false
      - key: MEALSCOUT_API_TOKEN
        sync: false
