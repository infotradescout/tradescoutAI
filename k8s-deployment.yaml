apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradescout-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tradescout-app
  template:
    metadata:
      labels:
        app: tradescout-app
    spec:
      containers:
      - name: app
        image: your-docker-repo/tradescout:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: tradescout-secrets
        readinessProbe:
          httpGet:
            path: /api/assistant/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/assistant/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: tradescout-app
spec:
  type: ClusterIP
  selector:
    app: tradescout-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tradescout-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tradescout-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
