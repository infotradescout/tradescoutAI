version: '3.9'

services:
  app:
    build: .
    container_name: tradescout_app
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./server/cache:/app/server/cache
      - ./server/cache/manual:/app/server/cache/manual
      - ./server/cache/autogenerated:/app/server/cache/autogenerated
      - ./client/public:/app/client/public
      - ./public:/app/public
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: tradescout_db
    restart: always
    environment:
      POSTGRES_DB: tradescout
      POSTGRES_USER: tradescout
      POSTGRES_PASSWORD: tradescoutpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradescout"]
      interval: 30s
      timeout: 5s
      retries: 3

  db_test:
    image: postgres:15-alpine
    container_name: tradescout_db_test
    restart: always
    environment:
      POSTGRES_DB: tradescout_test
      POSTGRES_USER: tradescout
      POSTGRES_PASSWORD: tradescoutpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradescout"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: tradescout_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  pgdata_test:
